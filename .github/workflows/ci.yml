name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Test ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every kernel: SDOT on ARM, AVX-512/AVX2 on x86. The model tests download about 75 MB
          # from Mozilla's CDN, cached between runs.
          - { name: linux-x64, os: ubuntu-latest, models: true }
          - { name: linux-arm64, os: ubuntu-24.04-arm, models: true }
          - { name: windows-x64, os: windows-latest, models: true }
          - { name: macos-arm64, os: macos-latest, models: true }
          # Instruction-set fallbacks, unit tests only, except that one portable job translates with
          # the models too (the portable kernel runs only under these switches).
          - { name: linux-x64-avx2, os: ubuntu-latest, flags: DOTNET_EnableAVX512=0 }
          - { name: linux-x64-portable, os: ubuntu-latest, flags: DOTNET_EnableAVX2=0, models: true }
          - { name: linux-arm64-portable, os: ubuntu-24.04-arm, flags: DOTNET_EnableArm64Dp=0 }
          - { name: linux-x64-scalar, os: ubuntu-latest, flags: DOTNET_EnableHWIntrinsic=0 }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Nerdbank.GitVersioning counts commits
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x # runtime for the net10.0 tests; the SDK comes from global.json
          global-json-file: global.json
      - name: Build
        run: dotnet build -c Release
      - name: Cache models
        if: matrix.models
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/tarjamot-models
          key: tarjamot-models-${{ runner.os }}-v1
      - name: Test
        shell: bash
        run: |
          if [ -n "${{ matrix.flags }}" ]; then export ${{ matrix.flags }}; fi
          filter=""
          if [ "${{ matrix.models }}" != "true" ]; then filter="--filter TestCategory!=ExternalServices"; fi
          dotnet test -c Release --no-build $filter --logger trx --results-directory TestResults
        env:
          TARJAMOT_TEST_MODELS: ${{ runner.temp }}/tarjamot-models
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.name }}
          path: TestResults

  pack:
    name: Pack
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Nerdbank.GitVersioning counts commits
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Pack
        shell: bash
        run: |
          dotnet pack src/Tarjamot -c Release -o artifacts
          dotnet pack src/Tarjamot.BergamotMarkup -c Release -o artifacts
          dotnet pack src/Tarjamot.LanguageIdentification -c Release -o artifacts
          # A release tag must name the version Nerdbank.GitVersioning computes (see nbgv tag).
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            for package in Tarjamot Tarjamot.BergamotMarkup Tarjamot.LanguageIdentification; do
              if [[ ! -f "artifacts/$package.${GITHUB_REF#refs/tags/v}.nupkg" ]]; then
                echo "::error::Tag ${GITHUB_REF#refs/tags/} does not match the version of $package: $(ls artifacts)"
                exit 1
              fi
            done
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/*

  # Trusted Publishing: nuget.org exchanges this job's GitHub OIDC token for a one-hour API key, so
  # the repository stores no key. The nuget.org policy names this repository, ci.yml and the
  # "nuget" environment; NUGET_USER is the nuget.org profile name that owns the policy.
  publish:
    name: Publish to NuGet
    if: startsWith(github.ref, 'refs/tags/v')
    needs: pack
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: artifacts
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x # only dotnet nuget push runs here, and there is no checkout for global.json
      - name: NuGet login (OIDC to temporary API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
